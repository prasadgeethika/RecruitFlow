server.port=8086
spring.application.name=interview-service

spring.datasource.url=jdbc:postgresql://localhost:5432/interview_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# AI-suggested feedback comments (see ai/AiCommentService.java).
# Same free Gemini key as job-service - get one from https://aistudio.google.com/apikey
# This is a SEPARATE env var setting (own Run Configuration) since this is a different process.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
