server.port=8082

spring.application.name=job-service

spring.datasource.url=jdbc:postgresql://localhost:5432/job_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Fuzzy job search now uses PostgreSQL's pg_trgm extension directly against
# job_db - no external search service, no extra config needed here. See
# PgTrgmInitializer.java and JobRepository.search().

# AI job description generation (see ai/AiJobDescriptionService.java).
# Get a free key (no credit card) from https://aistudio.google.com/apikey
gemini.api-key=${GEMINI_API_KEY:}
# Override with GEMINI_MODEL if this model ever gets retired for new users
# (Gemini's model lineup turns over fast - check
# https://ai.google.dev/gemini-api/docs/models for the current one).
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
